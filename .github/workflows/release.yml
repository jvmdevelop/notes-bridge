name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version, changelog and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release prerequisites
        env:
          TAG: ${{ github.ref_name }}
          NOTESBRIDGE_KEYSTORE_BASE64: ${{ secrets.NOTESBRIDGE_KEYSTORE_BASE64 }}
          NOTESBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.NOTESBRIDGE_KEYSTORE_PASSWORD }}
          NOTESBRIDGE_KEY_ALIAS: ${{ secrets.NOTESBRIDGE_KEY_ALIAS }}
          NOTESBRIDGE_KEY_PASSWORD: ${{ secrets.NOTESBRIDGE_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          grep -q "versionName = \"${version}\"" app/build.gradle.kts || { echo "::error::Tag ${TAG} does not match versionName in app/build.gradle.kts"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          for name in NOTESBRIDGE_KEYSTORE_BASE64 NOTESBRIDGE_KEYSTORE_PASSWORD NOTESBRIDGE_KEY_ALIAS NOTESBRIDGE_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Repository secret ${name} is not set"; exit 1; }
          done

  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  publish:
    name: Build signed APK and publish release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Decode keystore
        env:
          NOTESBRIDGE_KEYSTORE_BASE64: ${{ secrets.NOTESBRIDGE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$NOTESBRIDGE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notesbridge-release.jks"
      - name: Build signed release APK
        env:
          NOTESBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.NOTESBRIDGE_KEYSTORE_PASSWORD }}
          NOTESBRIDGE_KEY_ALIAS: ${{ secrets.NOTESBRIDGE_KEY_ALIAS }}
          NOTESBRIDGE_KEY_PASSWORD: ${{ secrets.NOTESBRIDGE_KEY_PASSWORD }}
        run: NOTESBRIDGE_KEYSTORE_PATH="$RUNNER_TEMP/notesbridge-release.jks" ./gradlew assembleRelease --stacktrace
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/notesbridge-release.jks"
      - name: Verify signature and prepare assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          apk="NotesBridge-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --verbose "$apk"
          certificate="$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          sha256sum "$apk" > SHA256SUMS.txt
          checksum="$(cut -d ' ' -f 1 SHA256SUMS.txt)"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]: / { exit }
            capture { print }
          ' CHANGELOG.md > changes.md
          {
            echo "## NotesBridge ${version}"
            echo
            cat changes.md
            echo
            echo "## Supported and unsupported formats"
            echo
            echo "See [docs/CONVERSION_SUPPORT.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/CONVERSION_SUPPORT.md) for the full table, and the [known limitations](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md#known-limitations)."
            echo
            echo "## Installation"
            echo
            echo "1. Download \`${apk}\` below on your Android 8.0+ device."
            echo "2. Open it and allow installation from this source when Android asks."
            echo "3. Share any supported document and choose **Convert to PDF**."
            echo
            echo "## Verification"
            echo
            echo "SHA-256 of \`${apk}\`:"
            echo
            echo '```'
            echo "${checksum}"
            echo '```'
            echo
            echo "Signing certificate SHA-256 fingerprint:"
            echo
            echo '```'
            echo "${certificate}"
            echo '```'
            echo
            echo "Check with \`sha256sum ${apk}\` and \`apksigner verify --print-certs ${apk}\`."
          } > release-notes.md
          cat release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" "NotesBridge-${version}.apk" SHA256SUMS.txt \
            --verify-tag \
            --title "NotesBridge ${version}" \
            --notes-file release-notes.md \
            --generate-notes
